<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahara Model School - Admission Form</title>
</head>
<style>
    body {
    background-color:#4CAF50;
        font-family: Arial, sans-serif;
        margin: 20px;
    }
    h1, h2 {
        text-align: center;
    }
    form {
        max-width: 600px;
        margin: 0 auto;
    }
    label {
        display: block;
        margin-top: 10px;
    }
    input, select, textarea {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
    }
    input[type="submit"], input[type="reset"] {
        background-color: #111077;
        color: white;
        padding: 10px 20px;
        border: none;
        cursor: pointer;
        margin-top: 20px;
    }
    input[type="reset"] {
        background-color: #f44336;
    }
</style>

<body>
<input type="tel" name="mobile"><br><br>

<h1 align="center">Sahara Model School</h1>
<h2 align="center">Admission Form</h2>

<form>

<label>Student Name:</label><br>
<input type="text" name="student_name" required><br><br>

<label>Father's Name:</label><br>
<input type="text" name="father_name" required><br><br>

<label>Mother's Name:</label><br>
<input type="text" name="mother_name" required><br><br>

<label>Date of Birth:</label><br>
<input type="date" name="dob"><br><br>

<label>Gender:</label><br>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
<br><br>

<label>Class:</label><br>
<select name="class">
<option>Nursery</option>
<option>LKG</option>
<option>UKG</option>
<option>Class I</option>
<option>Class II</option>
<option>Class III</option>
<option>Class IV</option>a
<option>Class V</option>
<option>Class VI</option>
<option>Class VII</option>
<option>Class VIII</option>
<option>Class IX</option>
<option>Class X</option>
</select>

<br><br>


<label>Mobile Number:</label><br>
<input type="tel" name="mobile"><br><br>
<label>Aadhaar Number:</label><br>
<input type="tel" name="aadhaar"><br><br>

<label>Email:</label><br>
<input type="email" name="email"><br><br>

<label>Address:</label><br>
<textarea rows="4" cols="40"></textarea><br><br>

<label>Upload Student Photo:</label><br>
<input type="file"><br><br>

<label>Upload Birth Certificate:</label><br>
<input type="file"><br><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

</body>
</html>
