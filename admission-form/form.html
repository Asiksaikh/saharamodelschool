<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sahara Model School - Online Admission</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f3;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        .header {
            text-align: center;
            color: #0F5233;
            border-bottom: 3px solid #0F5233;
            padding-bottom: 20px;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            color: #555;
        }

        .section {
            background: #0F5233;
            color: white;
            padding: 10px;
            margin-top: 25px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .button-area {
            text-align: center;
            margin-top: 25px;
        }

        button {
            padding: 13px 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .submit {
            background: #0F5233;
            color: white;
        }

        .reset {
            background: #777;
            color: white;
            margin-left: 10px;
        }

        @media(max-width: 600px) {
            .container {
                margin: 10px;
                padding: 20px;
            }

            .row {
                grid-template-columns: 1fr;
            }

            .reset {
                margin-left: 0;
                margin-top: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>SAHARA MODEL SCHOOL</h1>
        <p>ONLINE ADMISSION FORM</p>
        <p>Nursery to Higher Secondary</p>
    </div>

    <form action="submit.php" method="POST">

        <div class="section">
            Student Information
        </div>

        <div class="row">

            <div class="group">
                <label>Student Name *</label>
                <input type="text"
                       name="student_name"
                       required>
            </div>

            <div class="group">
                <label>Date of Birth *</label>
                <input type="date"
                       name="dob"
                       required>
            </div>

        </div>

        <div class="row">

            <div class="group">
                <label>Gender *</label>

                <select name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="group">
                <label>Class *</label>

                <select name="class" required>
                    <option value="">Select Class</option>
                    <option>Nursery</option>
                    <option>LKG</option>
                    <option>UKG</option>
                    <option>Class I</option>
                    <option>Class II</option>
                    <option>Class III</option>
                    <option>Class IV</option>
                    <option>Class V</option>
                    <option>Class VI</option>
                    <option>Class VII</option>
                    <option>Class VIII</option>
                    <option>Class IX</option>
                    <option>Class X</option>
                    <option>Class XI</option>
                    <option>Class XII</option>
                </select>
            </div>

        </div>


        <div class="section">
            Parent / Guardian Information
        </div>

        <div class="row">

            <div class="group">
                <label>Father's Name *</label>
                <input type="text"
                       name="father_name"
                       required>
            </div>

            <div class="group">
                <label>Mother's Name *</label>
                <input type="text"
                       name="mother_name"
                       required>
            </div>

        </div>

        <div class="row">

            <div class="group">
                <label>Mobile Number *</label>
                <input type="tel"
                       name="mobile"
                       maxlength="10"
                       required>
            </div>

            <div class="group">
                <label>Email</label>
                <input type="email"
                       name="email">
            </div>

        </div>


        <div class="section">
            Address
        </div>

        <div class="group">
            <label>Full Address *</label>

            <textarea
                name="address"
                required></textarea>
        </div>


        <div class="row">

            <div class="group">
                <label>Village / Town</label>
                <input type="text"
                       name="village">
            </div>

            <div class="group">
                <label>District</label>
                <input type="text"
                       name="district">
            </div>

        </div>


        <div class="row">

            <div class="group">
                <label>State</label>

                <input type="text"
                       name="state"
                       value="West Bengal">
            </div>

            <div class="group">
                <label>PIN Code</label>

                <input type="text"
                       name="pin"
                       maxlength="6">
            </div>

        </div>


        <div class="section">
            Previous School Information
        </div>

        <div class="row">

            <div class="group">
                <label>Previous School</label>
                <input type="text"
                       name="previous_school">
            </div>

            <div class="group">
                <label>Previous Class</label>
                <input type="text"
                       name="previous_class">
            </div>

        </div>


        <div class="section">
            Additional Information
        </div>

        <div class="group">
            <label>Message</label>

            <textarea
                name="message"
                placeholder="Additional information..."></textarea>
        </div>


        <div class="button-area">

            <button
                type="submit"
                class="submit">
                Submit Application
            </button>

            <button
                type="reset"
                class="reset">
                Reset
            </button>

        </div>

    </form>

</div>

</body>
</html>
